# Ancien domaine : redirection permanente vers rubiks.coality.net.
# A activer UNIQUEMENT une fois que rubiks.coality.net repond en HTTPS,
# sinon les visiteurs et les moteurs sont envoyes vers un site injoignable.
#
# Le 301 conserve le referencement acquis : Google transfere le classement de
# l'ancienne URL vers la nouvelle, page par page (le chemin est preserve).
<VirtualHost *:80>
    ServerName rubik.coality.net
    RedirectPermanent / https://rubiks.coality.net/
    ErrorLog  ${APACHE_LOG_DIR}/rubik_error.log
    CustomLog ${APACHE_LOG_DIR}/rubik_access.log combined
</VirtualHost>
