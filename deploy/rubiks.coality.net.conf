# Tutoriel Rubik's Cube — site 100% statique, aucun service a faire tourner.
# Le HTTPS et la redirection sont ajoutes par certbot (fichier -le-ssl.conf).
#
# Les reglages communs (Directory, deflate, expires, en-tetes) vivent dans
# conf-available/rubiks-common.conf, inclus ici ET dans le vhost HTTPS : c'est
# ce dernier qui sert le trafic reel, et dupliquer les directives revenait a
# corriger un fichier sans effet.
<VirtualHost *:80>
    ServerName rubiks.coality.net
    DocumentRoot /opt/rubiks-doc/site

    Include conf-available/rubiks-common.conf

    ErrorLog  ${APACHE_LOG_DIR}/rubiks_error.log
    CustomLog ${APACHE_LOG_DIR}/rubiks_access.log combined
</VirtualHost>
