# Tutoriel Rubik's Cube — site 100% statique, aucun service a faire tourner.
# Le HTTPS et la redirection sont ajoutes par certbot (fichier -le-ssl.conf).
<VirtualHost *:80>
    ServerName rubiks.coality.net
    DocumentRoot /opt/rubiks-doc/site

    <Directory /opt/rubiks-doc/site>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain \
            application/javascript application/json image/svg+xml
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        # les schemas de cube ne changent jamais une fois publies
        ExpiresByType image/svg+xml "access plus 30 days"
        ExpiresByType text/css      "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
        ExpiresDefault              "access plus 1 hour"
    </IfModule>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/rubiks_error.log
    CustomLog ${APACHE_LOG_DIR}/rubiks_access.log combined
</VirtualHost>
