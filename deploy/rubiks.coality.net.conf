# Tutoriel Rubik's Cube — site 100% statique, aucun service a faire tourner.
# Le HTTPS et la redirection sont ajoutes par certbot (fichier -le-ssl.conf).
<VirtualHost *:80>
    ServerName rubiks.coality.net
    DocumentRoot /opt/rubiks-doc/site

    <Directory /opt/rubiks-doc/site>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain \
            application/javascript application/json image/svg+xml
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        # ATTENTION : les schemas sont REGENERES a chaque build et gardent leur
        # nom de fichier. Ils changent donc bel et bien -- « 30 days » servait
        # une figure perimee pendant un mois (vecu : 3d-arete-insere renomme,
        # coins-placer redessine). Sans empreinte dans le nom, pas de cache long.
        ExpiresByType image/svg+xml "access plus 1 hour"
        ExpiresByType text/css      "access plus 1 hour"
        ExpiresByType application/javascript "access plus 1 hour"
        ExpiresDefault              "access plus 1 hour"
    </IfModule>

    <IfModule mod_headers.c>
        # Le HTML doit etre revalide a chaque visite : sinon une correction
        # reste invisible jusqu'a une heure et le site a l'air fige. ETag et
        # Last-Modified rendent la revalidation quasi gratuite (reponse 304,
        # zero octet de corps).
        <FilesMatch "\.html$">
            Header always set Cache-Control "no-cache"
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/rubiks_error.log
    CustomLog ${APACHE_LOG_DIR}/rubiks_access.log combined
</VirtualHost>
