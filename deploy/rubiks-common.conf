# Reglages communs aux deux vhosts du site (port 80 et port 443).
#
# Pourquoi un fichier separe : certbot cree le vhost HTTPS en copiant le vhost
# HTTP, puis plus personne ne les tient synchronises. Or c'est le vhost HTTPS
# qui sert TOUT le trafic. Une correction apportee au seul fichier du depot
# n'avait donc aucun effet visible -- c'est arrive.
#
# Installe dans /etc/apache2/conf-available/ mais volontairement PAS active par
# a2enconf : il ne doit s'appliquer qu'aux deux vhosts de ce site, pas aux
# ~18 autres du serveur. Chaque vhost l'inclut explicitement.

<Directory /opt/rubiks-doc/site>
    Require all granted
    Options -Indexes +FollowSymLinks
    AllowOverride None
</Directory>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain \
        application/javascript application/json image/svg+xml
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On
    # ATTENTION : les schemas sont REGENERES a chaque build et gardent leur nom
    # de fichier. Ils changent donc bel et bien -- « 30 days » a servi une
    # figure perimee pendant un mois (vecu : 3d-arete-insere renomme,
    # coins-placer redessine). Sans empreinte dans le nom, pas de cache long.
    # Le HTML n'est jamais garde sans revalidation : une correction doit etre
    # visible tout de suite. Double securite avec le Cache-Control ci-dessous,
    # car l'ordre d'application entre mod_expires et mod_headers n'est pas
    # garanti — si l'un des deux ne prend pas, l'autre fait le travail.
    ExpiresByType text/html     "access plus 0 seconds"
    ExpiresByType image/svg+xml "access plus 1 hour"
    ExpiresByType text/css      "access plus 1 hour"
    ExpiresByType application/javascript "access plus 1 hour"
    ExpiresDefault              "access plus 1 hour"
</IfModule>

<IfModule mod_headers.c>
    # Le HTML doit etre revalide a chaque visite : sinon une correction reste
    # invisible jusqu'a une heure et le site a l'air fige. ETag et Last-Modified
    # rendent la revalidation quasi gratuite (reponse 304, zero octet de corps).
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
